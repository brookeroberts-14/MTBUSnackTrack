<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnackTrack - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-zinc-100">
<div class="min-h-screen flex items-center justify-center p-8">
  <div class="w-full max-w-md">
    <div class="bg-white border border-zinc-300 rounded-lg p-8">
      <h1 class="text-2xl font-bold tracking-tight mb-1">SnackTrack</h1>
      <p class="text-zinc-500 text-sm mb-6">Sign in to your account</p>

      {% if error %}
      <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-md text-red-700 text-sm">{{ error }}</div>
      {% endif %}

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Email</label>
          <input type="email" name="email" required placeholder="name@example.com"
            class="w-full px-3 py-2 border border-zinc-300 rounded-md focus:outline-none focus:ring-2 focus:ring-zinc-900">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Password</label>
          <input type="password" name="password" required placeholder="Enter your password"
            class="w-full px-3 py-2 border border-zinc-300 rounded-md focus:outline-none focus:ring-2 focus:ring-zinc-900">
        </div>
        <button type="submit" class="w-full bg-zinc-900 text-white py-2 px-4 rounded-md hover:bg-zinc-800 font-medium">Sign in</button>
      </form>

      <p class="mt-6 text-center text-sm text-zinc-500">
        Don't have an account? <a href="{% url 'register' %}" class="text-zinc-900 font-medium hover:underline">Sign up</a>
      </p>

      <div class="mt-4 p-3 bg-zinc-100 rounded-md text-xs text-zinc-500">
        <p class="font-semibold">Demo Credentials:</p>
        <p>Email: admin@snacktrack.com</p>
        <p>Password: Admin123!</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
