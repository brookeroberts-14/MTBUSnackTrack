<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnackTrack - Classroom Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-zinc-100">
<header class="bg-white border-b border-zinc-300">
  <div class="max-w-xl mx-auto px-4 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-tight">SnackTrack</h1>
    <a href="{% url 'admin_classrooms' %}" class="text-sm text-zinc-500 hover:text-zinc-900">Back to Admin</a>
  </div>
</header>
<main class="max-w-xl mx-auto px-4 py-8">
  <div class="bg-white border border-zinc-300 rounded-lg p-6">
    <h2 class="text-xl font-bold mb-6">{% if editing %}Edit{% else %}Add{% endif %} Classroom</h2>
    {% if error %}<div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-md text-red-700 text-sm">{{ error }}</div>{% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Classroom Name</label>
        <input type="text" name="name" required placeholder="e.g., Room 101" value="{{ classroom.name|default:'' }}" class="w-full px-3 py-2 border border-zinc-300 rounded-md">
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-zinc-900 text-white px-6 py-2 rounded-md hover:bg-zinc-800 font-medium">Save</button>
        <a href="{% url 'admin_classrooms' %}" class="px-6 py-2 border border-zinc-300 rounded-md hover:bg-zinc-50 font-medium">Cancel</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
